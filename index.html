<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Msurg Pack Calculators - @Azwaa</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000; --card: #0a0a0a; --accent: #00ff88;
            --border: #1a1a1a; --input-bg: #111; --text: #ffffff; --sub-text: #666;
        }

        * { box-sizing: border-box; outline: none; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 20px; 
            overflow-x: hidden;
        }

        /* --- ⚡ ENTRANCE ANIMATION ⚡ --- */
        .header-wrap { 
            position: relative; 
            padding: 40px 0; 
            margin-bottom: 30px; 
            overflow: hidden;
        }

        .lightning-line { 
            position: absolute; 
            left: 0; 
            top: 0; 
            height: 100%; 
            width: 4px; 
            background: var(--accent); 
            box-shadow: 0 0 30px var(--accent); 
            animation: pulse 1.5s infinite; 
        }

        @keyframes pulse { 50% { opacity: 0.4; box-shadow: 0 0 50px var(--accent); } }

        .title-main { 
            font-family: 'Syncopate', sans-serif; 
            font-size: clamp(1.4rem, 5vw, 2.5rem); 
            padding-left: 25px; 
            letter-spacing: -1px;
            transform: translateX(-100%);
            animation: slideIn 0.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        @keyframes slideIn { to { transform: translateX(0); } }

        .author-tag { 
            font-size: 11px; 
            color: var(--accent); 
            padding-left: 25px; 
            letter-spacing: 8px; 
            font-weight: 900; 
            text-transform: uppercase; 
            margin-top: 5px; 
            opacity: 0;
            animation: fadeIn 1s 0.6s forwards;
        }

        /* --- CONTAINER LAYOUT --- */
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            display: flex; 
            gap: 30px; 
            opacity: 0;
            animation: fadeIn 1s 0.8s forwards;
        }

        .main-inputs { flex: 1; }
        .sidebar { width: 380px; }

        @media (max-width: 1050px) { 
            .container { flex-direction: column; } 
            .sidebar { width: 100%; } 
        }

        .card { 
            background: var(--card); 
            border: 1px solid var(--border); 
            border-radius: 20px; 
            padding: 25px; 
            margin-bottom: 25px; 
            transition: 0.3s;
        }

        .section-header { 
            font-size: 10px; 
            font-weight: 900; 
            color: var(--accent); 
            letter-spacing: 2px; 
            margin-bottom: 25px; 
            text-transform: uppercase; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        /* --- MODE SWITCH BUTTONS --- */
        .mode-switch { 
            display: flex; 
            background: #111; 
            border: 1px solid #222; 
            border-radius: 12px; 
            padding: 5px; 
            gap: 5px; 
        }

        .m-btn { 
            cursor: pointer; 
            padding: 8px 15px; 
            border-radius: 8px; 
            font-size: 9px; 
            font-weight: 900; 
            color: var(--sub-text); 
            transition: 0.3s; 
            border: none; 
            background: transparent;
        }

        .m-btn.active { background: var(--accent); color: #000; box-shadow: 0 0 15px rgba(0,255,136,0.3); }

        /* --- GRID & INPUTS --- */
        .grid-inputs { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); 
            gap: 15px; 
        }

        .input-item { 
            background: var(--input-bg); 
            border: 1px solid #1a1a1a; 
            border-radius: 15px; 
            padding: 20px 10px; 
            text-align: center; 
            transition: 0.3s;
        }

        .input-item:hover { border-color: var(--accent); transform: translateY(-3px); }

        .input-item img { 
            width: 32px; 
            height: 32px; 
            margin-bottom: 12px; 
        }

        .input-item span { 
            display: block; 
            font-size: 8px; 
            color: var(--sub-text); 
            font-weight: 800; 
            text-transform: uppercase; 
            margin-bottom: 10px;
        }
        
        input { 
            width: 85%; 
            background: #000; 
            border: 1px solid #333; 
            border-radius: 6px;
            color: #fff; 
            text-align: center; 
            font-size: 16px; 
            font-family: 'JetBrains Mono', monospace; 
            padding: 6px 0;
        }

        input:focus { border-color: var(--accent); }

        /* --- SIDEBAR & BUTTON --- */
        .btn-analyze { 
            width: 100%; 
            padding: 22px; 
            background: var(--accent); 
            color: #000; 
            border: none; 
            border-radius: 15px; 
            font-family: 'Syncopate', sans-serif; 
            font-size: 12px; 
            font-weight: 900; 
            cursor: pointer; 
            margin-bottom: 20px; 
            transition: 0.4s;
        }

        .btn-analyze:hover { box-shadow: 0 0 30px var(--accent); transform: translateY(-2px); }

        .res-card { 
            background: #050505; 
            border: 1px solid var(--border); 
            border-radius: 20px; 
            padding: 30px; 
            min-height: 420px; 
        }

        .console { 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 11px; 
            color: var(--accent); 
            min-height: 50px; 
            margin-bottom: 25px; 
        }

        /* --- RESULTS SLOT MACHINE --- */
        .currency-row { 
            display: none; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 12px; 
            margin: 25px 0; 
        }

        .cur-box { 
            background: #0a0a0a; 
            padding: 20px 5px; 
            border-radius: 15px; 
            border: 1px solid #1a1a1a; 
            text-align: center; 
        }

        .cur-val { display: block; font-size: 26px; font-weight: 900; color: #fff; }
        .cur-lbl { font-size: 9px; color: var(--sub-text); font-weight: 800; margin-top: 5px; display: block; }

        .profit-line { 
            display: none; 
            font-size: 22px; 
            font-weight: 900; 
            padding-top: 20px; 
            border-top: 1px solid #111; 
            text-align: center; 
        }

        .bar-wrap { display: none; margin-top: 30px; }
        .bar-label { display: flex; justify-content: space-between; font-size: 8px; color: var(--sub-text); margin-bottom: 8px; font-weight: 800; }
        .bar-bg { width: 100%; height: 5px; background: #111; border-radius: 10px; overflow: hidden; margin-bottom: 15px; }
        .bar-fill { height: 100%; width: 0; background: var(--accent); transition: 2s cubic-bezier(0.19, 1, 0.22, 1); }

        @keyframes fadeIn { to { opacity: 1; } }
    </style>
</head>
<body>

    <header class="header-wrap">
        <div class="lightning-line"></div>
        <div class="title-main">MSURG CALCULATOR</div>
        <div class="author-tag">By @Azwaa</div>
    </header>

    <div class="container">
        <div class="main-inputs">
            <div class="card">
                <div class="section-header">
                    <span>Market Setup</span>
                    <div class="mode-switch">
                        <button id="btn-all" class="m-btn active" onclick="setMode('all')">SELL ALL</button>
                        <button id="btn-vend" class="m-btn" onclick="setMode('vend')">SELL VEND</button>
                    </div>
                </div>
                <div class="grid-inputs">
                    <div class="input-item"><span>Total Packs</span><input type="number" id="packs" value="0"></div>
                    <div class="input-item"><span>Buy Price (WL)</span><input type="number" id="buyPrice" value="0"></div>
                    <div class="input-item">
                        <img src="stitches.png">
                        <span id="lbl_stitch">Stitches (200/...WL)</span>
                        <input type="number" id="p_stitch" value="0">
                    </div>
                    <div class="input-item">
                        <img src="surg-e.png">
                        <span id="lbl_surge">Surg-E (200/...WL)</span>
                        <input type="number" id="p_surge" value="0">
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="section-header">Surgery Tools (Qty / 1WL)</div>
                <div class="grid-inputs" id="tools-grid"></div>
            </div>
        </div>

        <div class="sidebar">
            <button class="btn-analyze" onclick="startAnalysis()">CALCULATE PROFIT</button>
            <div class="res-card">
                <div id="console" class="console">> SYSTEM READY...</div>
                
                <div id="res-display">
                    <div class="currency-row" id="cur-row">
                        <div class="cur-box"><span class="cur-val" id="res_bgl">0</span><span class="cur-lbl">BGL</span></div>
                        <div class="cur-box"><span class="cur-val" id="res_dl">0</span><span class="cur-lbl">DL</span></div>
                        <div class="cur-box"><span class="cur-val" id="res_wl">0</span><span class="cur-lbl">WL</span></div>
                    </div>

                    <div id="res_profit" class="profit-line"></div>

                    <div class="bar-wrap" id="b-wrap">
                        <div class="bar-label"><span>PREMIUM ITEMS</span><span id="perc1">0%</span></div>
                        <div class="bar-bg"><div class="bar-fill" id="fill_p1"></div></div>
                        <div class="bar-label"><span>BASIC TOOLS</span><span id="perc2">0%</span></div>
                        <div class="bar-bg"><div class="bar-fill" id="fill_p2"></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
    let currentMode = 'all';

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('btn-all').classList.toggle('active', mode === 'all');
        document.getElementById('btn-vend').classList.toggle('active', mode === 'vend');
        
        const sLabel = document.getElementById('lbl_stitch');
        const rLabel = document.getElementById('lbl_surge');
        
        if(mode === 'all') {
            sLabel.innerText = "Stitches (200/...WL)";
            rLabel.innerText = "Surg-E (200/...WL)";
        } else {
            sLabel.innerText = "Stitches (1/...WL)";
            rLabel.innerText = "Surg-E (1/...WL)";
        }
    }

    const toolList = ['scalpel', 'sponge', 'antibiotics', 'antiseptic', 'anesthetic', 'ultrasound', 'labkit', 'scissors', 'splint', 'pins', 'transfusion', 'clamp'];
    const grid = document.getElementById('tools-grid');
    toolList.forEach(t => {
        grid.innerHTML += `
            <div class="input-item">
                <img src="${t}.png"><span>${t}</span>
                <input type="number" id="p_${t.substring(0,4)}" value="0">
            </div>`;
    });

    function startAnalysis() {
        const consoleEl = document.getElementById('console');
        document.getElementById('cur-row').style.display = 'none';
        document.getElementById('res_profit').style.display = 'none';
        document.getElementById('b-wrap').style.display = 'none';

        const logs = ["Initializing Scan...", "Checking Market Mode...", "Calculating Revenue...", "Finalizing Data..."];
        let i = 0;
        function type() {
            if(i < logs.length) {
                consoleEl.innerHTML = "> " + logs[i];
                i++; setTimeout(type, 400);
            } else { showResults(); }
        }
        type();
    }

    function showResults() {
        document.getElementById('console').innerHTML = "> ANALYSIS COMPLETE.";
        document.getElementById('cur-row').style.display = 'grid';
        document.getElementById('res_profit').style.display = 'block';
        document.getElementById('b-wrap').style.display = 'block';

        const packs = parseFloat(document.getElementById('packs').value) || 0;
        const buy = parseFloat(document.getElementById('buyPrice').value) || 0;
        const ids = ['p_scal', 'p_spon', 'p_anti', 'p_anti', 'p_anes', 'p_ultr', 'p_labk', 'p_scis', 'p_spli', 'p_pins', 'p_tran', 'p_clam'];
        
        let toolWL = 0;
        ids.forEach(id => {
            let rate = parseFloat(document.getElementById(id).value) || 0;
            if(rate > 0) toolWL += (packs * 20 / rate);
        });

        let pStitch = parseFloat(document.getElementById('p_stitch').value) || 0;
        let pSurge = parseFloat(document.getElementById('p_surge').value) || 0;
        let premiumWL = 0;

        if(currentMode === 'all') {
            premiumWL = ((packs * 20 / 200) * pStitch) + ((packs * 5 / 200) * pSurge);
        } else {
            premiumWL = ((packs * 20) * pStitch) + ((packs * 5) * pSurge);
        }

        let total = Math.floor(toolWL + premiumWL);
        let profit = total - (packs * buy);

        // Slot Machine Anim
        animateSlot("res_bgl", Math.floor(total / 10000));
        animateSlot("res_dl", Math.floor((total % 10000) / 100));
        animateSlot("res_wl", total % 100);

        const pEl = document.getElementById('res_profit');
        pEl.innerText = (profit >= 0 ? "PROFIT: +" : "PROFIT: ") + Math.floor(profit).toLocaleString() + " WL";
        pEl.style.color = profit >= 0 ? "#00ff88" : "#ff4444";

        let ratio = total > 0 ? (premiumWL / total * 100) : 0;
        document.getElementById('fill_p1').style.width = ratio + "%";
        document.getElementById('fill_p2').style.width = (100 - ratio) + "%";
        document.getElementById('perc1').innerText = Math.round(ratio) + "%";
        document.getElementById('perc2').innerText = Math.round(100 - ratio) + "%";
    }

    function animateSlot(id, target) {
        const el = document.getElementById(id);
        let start = null;
        function step(timestamp) {
            if (!start) start = timestamp;
            if (timestamp - start < 1200) {
                el.innerText = Math.floor(Math.random() * 99);
                requestAnimationFrame(step);
            } else { el.innerText = target; }
        }
        requestAnimationFrame(step);
    }
</script>
</body>
</html>
